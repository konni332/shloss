[package]
name = "shloss-client"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"] }
shloss-types = { path = "../shloss-types" }
chrono = { version = "0.4", features = ["serde"] }
ipnetwork = { version = "0.21", features = ["serde"] }
