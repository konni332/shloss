[package]
name = "shloss-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "shloss-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
getrandom = "0.4"
toml = "1"
anyhow = "1"
hex = "0.4"
dialoguer = "0.12"
