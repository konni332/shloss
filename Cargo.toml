[workspace]
members = ["crates/shloss-cli"]
resolver = "3"

[package]
name = "shloss"
version = "0.2.0"
edition = "2024"

[lib]
name = "shloss"
path = "src/lib.rs"

[[bin]]
name = "shloss"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "uuid", "ipnetwork", "chrono"] }
axum = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.15"
toml = "1"
argon2 = { version = "0.5", features = ["password-hash", "std"] }
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ipnetwork = { version = "0.21", features = ["serde"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
tower = "0.5"
rsa = { version = "0.9", features = ["pem"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
axum-test = "20"
serde_json = "1"
