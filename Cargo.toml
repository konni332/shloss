[package]
name = "shloss"
version = "0.1.0"
edition = "2024"

[lib]
name = "shloss"
path = "src/lib.rs"

[[bin]]
name = "shloss"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "uuid", "ipnetwork", "chrono"] }
axum = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.15"
toml = "1"
argon2 = { version = "0.5", features = ["password-hash", "std"] }
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
ipnetwork = "0.21"

